<style>
/* Layout: mobile-first QR menu. Cover + logo, info chips, featured carousel, category tiles,
   sticky category tabs, item rows with thumbnails, bottom-sheet item detail. */
:root {
  --bg: #f3f5f1;
  --surface: #ffffff;
  --surface-2: #e9eee7;
  --fg: #16201b;
  --muted: #5d6a61;
  --line: #dfe5dc;
  --accent: #1f4d3a;
  --accent-ink: #ffffff;
  --brass: #9a7631;
  --brass-soft: #f1e8d4;
  --cover-a: #1f4d3a;
  --cover-b: #12301f;
  --shadow: 0 1px 2px rgb(20 40 30 / .06), 0 6px 20px rgb(20 40 30 / .06);
  --font-display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1511; --surface: #171f1a; --surface-2: #1f2a23; --fg: #e8ede6; --muted: #9ca89f; --line: #26322a;
    --accent: #8cc5a6; --accent-ink: #0d1912; --brass: #d8b46c; --brass-soft: #2a2416;
    --cover-a: #183c2d; --cover-b: #0b1a12; --shadow: 0 1px 2px rgb(0 0 0 / .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1511; --surface: #171f1a; --surface-2: #1f2a23; --fg: #e8ede6; --muted: #9ca89f; --line: #26322a;
  --accent: #8cc5a6; --accent-ink: #0d1912; --brass: #d8b46c; --brass-soft: #2a2416;
  --cover-a: #183c2d; --cover-b: #0b1a12; --shadow: 0 1px 2px rgb(0 0 0 / .3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before { animation: none !important; transition: none !important; } }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 1rem; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; border-radius: 8px; }
.app { max-width: 760px; margin: 0 auto; }
.pad { padding-inline: 16px; }
.ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* Cover */
.cover {
  position: relative; height: 210px; overflow: hidden;
  background:
    radial-gradient(circle at 18% 30%, rgb(255 255 255 / .08) 0 2px, transparent 3px) 0 0 / 28px 28px,
    radial-gradient(120% 120% at 80% 0%, var(--cover-a), var(--cover-b));
}
.cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgb(0 0 0 / .15), rgb(0 0 0 / .35)); }
.cover-tools { position: absolute; top: 12px; right: 12px; z-index: 2; display: flex; gap: 8px; }
.round {
  height: 40px; min-width: 40px; padding: 0 12px; border-radius: 999px; border: 0;
  background: rgb(255 255 255 / .92); color: #16201b; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font-weight: 600; font-size: .85rem; box-shadow: 0 2px 8px rgb(0 0 0 / .15);
}
.brand { position: relative; margin-top: -44px; display: flex; align-items: flex-start; gap: 14px; z-index: 2; }
.logo {
  width: 88px; height: 88px; border-radius: 50%; flex: none; display: grid; place-items: center;
  background: var(--surface); border: 4px solid var(--bg); box-shadow: var(--shadow);
  font-family: var(--font-display); font-size: 1.15rem; line-height: 1; text-align: center; color: var(--accent);
}
.logo i { display: block; color: var(--brass); font-size: .95rem; }
.brand-text { padding-top: 52px; min-width: 0; }
.brand h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.9rem; line-height: 1.05; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: .92rem; }
.info { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.info > span, .info > a {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line); font-size: .85rem; font-weight: 500; color: var(--fg); text-decoration: none;
}
.info .ico { width: 16px; height: 16px; color: var(--accent); }

/* Section heads */
.h2 { display: flex; justify-content: space-between; align-items: baseline; margin: 28px 0 12px; }
.h2 h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.5rem; }
.h2 span { color: var(--muted); font-size: .85rem; }

/* Featured carousel */
.featured { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 2px 16px 8px; margin-inline: 0; scrollbar-width: none; }
.featured::-webkit-scrollbar { display: none; }
.feat {
  scroll-snap-align: start; flex: 0 0 min(78%, 300px); border: 0; padding: 0; text-align: left;
  border-radius: var(--r); overflow: hidden; background: var(--surface); box-shadow: var(--shadow); display: flex; flex-direction: column;
}
.feat .ph { aspect-ratio: 16 / 9; }
.feat .body { padding: 12px 14px 14px; display: grid; gap: 2px; }
.feat .badge { justify-self: start; }
.feat b { font-weight: 600; font-size: 1.02rem; }
.feat .price { color: var(--accent); font-weight: 700; }

/* Photo or illustrated placeholder */
.ph { position: relative; display: grid; place-items: center; background: var(--surface-2); color: var(--accent); overflow: hidden; }
.ph .ico { width: 40%; height: 40%; max-width: 56px; max-height: 56px; stroke-width: 1.2; opacity: .75; }
.ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ph.t-warm { background: var(--brass-soft); color: var(--brass); }

/* Category tiles */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile {
  border: 0; padding: 0; text-align: left; background: var(--surface); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow);
  display: flex; flex-direction: column;
}
.tile .ph { aspect-ratio: 4 / 3; }
.tile span { padding: 8px 10px 10px; font-weight: 600; font-size: .86rem; line-height: 1.25; }

/* Sticky tabs */
.tabs-wrap { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); margin-top: 28px; }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); font-size: .88rem; font-weight: 500; white-space: nowrap;
}
.tab .ico { width: 16px; height: 16px; }
.tab.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.searchbar { display: flex; gap: 8px; padding: 10px 16px 0; }
.searchbar input {
  flex: 1; min-width: 0; font: inherit; padding: 11px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg);
}
.searchbar input:focus { outline: none; border-color: var(--accent); }
.searchbar button { border: 0; background: none; color: var(--accent); font-weight: 600; }

/* Menu */
.cat { padding-top: 22px; scroll-margin-top: 64px; }
.cat-head { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
.cat-head h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.6rem; }
.cat-head .n { color: var(--muted); font-size: .82rem; }
.cat-note { margin: 0 0 6px; color: var(--muted); font-size: .88rem; }
.sub { margin: 16px 0 4px; font-size: .74rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--brass); }
.list { display: grid; gap: 10px; }
.row {
  display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; width: 100%;
  border: 0; text-align: left; padding: 10px; border-radius: 14px; background: var(--surface); box-shadow: var(--shadow);
}
.row.has-ph { grid-template-columns: 64px 1fr auto; }
.row .ph { width: 64px; height: 64px; border-radius: 10px; }
.row .txt { min-width: 0; display: grid; gap: 1px; }
.row .nm { font-weight: 600; line-height: 1.3; }
.row .ds { color: var(--muted); font-size: .84rem; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row .sz { color: var(--muted); font-size: .8rem; }
.row .pr { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--accent); }
.row .pr small { display: block; font-weight: 500; color: var(--muted); font-size: .72rem; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: .7rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; background: var(--brass-soft); color: var(--brass); }
.empty { padding: 48px 0; text-align: center; color: var(--muted); }

/* Bottom sheet */
dialog.sheet {
  border: 0; padding: 0; margin: auto auto 0; width: 100%; max-width: 560px; max-height: 88vh; overflow: auto;
  border-radius: 22px 22px 0 0; background: var(--surface); color: var(--fg);
}
dialog.sheet::backdrop { background: rgb(5 12 8 / .55); }
dialog.sheet[open] { animation: up .25s ease-out; }
@keyframes up { from { transform: translateY(30px); opacity: .4; } }
@media (min-width: 620px) { dialog.sheet { margin: auto; border-radius: 22px; } }
.sheet .ph { aspect-ratio: 16 / 10; }
.sheet .close { position: absolute; top: 12px; right: 12px; z-index: 2; }
.sheet .in { padding: 18px 20px calc(24px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 10px; }
.sheet .badge { justify-self: start; }
.sheet h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.7rem; line-height: 1.1; }
.sheet p { margin: 0; color: var(--muted); }
.variants { display: grid; gap: 0; margin-top: 4px; }
.variants div { display: flex; justify-content: space-between; padding: 10px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.variants b { color: var(--accent); }

footer { margin-top: 40px; padding: 28px 16px 40px; border-top: 1px solid var(--line); color: var(--muted); font-size: .86rem; display: grid; gap: 6px; text-align: center; }
footer b { font-family: var(--font-display); font-weight: 400; color: var(--fg); font-size: 1.2rem; }

@media (min-width: 700px) {
  .cover { height: 260px; border-radius: 0 0 24px 24px; }
  .tiles { grid-template-columns: repeat(5, 1fr); }
  .list { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 360px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>

const FEATURED = [
  { promo: true, sr: "Espresso + Coca-Cola limenka", en: "Espresso + Coca-Cola can", p: 340, img: "akcija", icon: "cup",
    d: { sr: "Akcijska ponuda: espresso i Coca-Cola u limenci zajedno.", en: "Special offer: an espresso with a can of Coca-Cola." } },
  { ref: ["shake", "Butik shake"] },
  { ref: ["vino", "Domaće vino, Vinarija Nedin"] },
  { ref: ["kokteli", "Aperol Spritz"] },
  { ref: ["sladoled", "Banana split"] },
];

/* ------------------------------------------------------------------ */
let lang = "sr";
try { lang = localStorage.getItem("bc-lang") === "en" ? "en" : "sr"; } catch (e) {}

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const tr = v => v == null ? "" : typeof v === "string" ? v : (v[lang] || v.sr);
const nameOf = i => lang === "en" && i.en ? i.en : i.sr;
const fold = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "dj");
const money = n => n.toLocaleString("sr-RS");
const t = k => UI[lang][k];
const icon = (id, cls = "ico") => `<svg class="${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const minPrice = i => i.v ? Math.min(...i.v.map(x => x[1])) : i.p;

// Photo with icon fallback. A broken or missing photo removes itself.
function ph(img, ic, warm) {
  const photo = img ? `<img src="${SETTINGS.imgDir}${img}${SETTINGS.imgExt}" alt="" loading="lazy" onerror="this.remove()">` : "";
  return `<div class="ph${warm ? " t-warm" : ""}">${icon(ic)}${photo}</div>`;
}

const flat = [];
MENU.forEach(c => c.items.forEach((i, idx) => { i.cat = c; i.key = `${c.id}-${idx}`; flat.push(i); }));
const byKey = Object.fromEntries(flat.map(i => [i.key, i]));
const featured = FEATURED.map((f, n) => {
  if (!f.ref) { f.key = "promo-" + n; byKey[f.key] = f; return f; }
  return flat.find(i => i.cat.id === f.ref[0] && i.sr === f.ref[1]);
}).filter(Boolean);

function priceHTML(i) {
  if (!i.v) return `${money(i.p)} <small>RSD</small>`;
  return `<small>${t("from")}</small>${money(minPrice(i))} <small>RSD</small>`;
}
function sizeText(i) {
  if (i.v) return i.v.map(x => tr(x[0])).filter(Boolean).join(" · ");
  return tr(i.s);
}
function badge(i) {
  if (i.promo || i.tag === "promo") return `<span class="badge">${t("promo")}</span>`;
  if (i.tag === "rec") return `<span class="badge">${t("rec")}</span>`;
  if (i.tag === "house") return `<span class="badge">${t("house")}</span>`;
  return "";
}

function renderStatic() {
  document.documentElement.lang = lang === "sr" ? "sr-Latn" : "en";
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });
  $("#langBtn").textContent = t("lang");
  $("#q").placeholder = t("search");

  $("#featured").innerHTML = featured.map(i => `<button class="feat" type="button" data-key="${i.key}">
    ${ph(i.img, i.icon || i.cat.icon, i.promo)}
    <div class="body">${badge(i)}<b>${esc(nameOf(i))}</b><span class="price">${priceHTML(i)}</span></div>
  </button>`).join("");

  $("#tiles").innerHTML = MENU.map(c => `<button class="tile" type="button" data-go="${c.id}">
    ${ph("kategorija-" + c.id, c.icon)}<span>${esc(tr(c))}</span></button>`).join("");

  $("#tabs").innerHTML = MENU.map(c => `<button class="tab" type="button" data-go="${c.id}">${icon(c.icon)}${esc(tr(c))}</button>`).join("");
}

function rowHTML(i) {
  const size = sizeText(i);
  const desc = tr(i.d);
  return `<button class="row${i.img ? " has-ph" : ""}" type="button" data-key="${i.key}">
    ${i.img ? ph(i.img, i.cat.icon) : ""}
    <span class="txt">
      <span class="nm">${esc(nameOf(i))}</span>
      ${desc ? `<span class="ds">${esc(desc)}</span>` : ""}
      ${size ? `<span class="sz">${esc(size)}</span>` : ""}
      ${badge(i) ? `<span>${badge(i)}</span>` : ""}
    </span>
    <span class="pr">${priceHTML(i)}</span>
  </button>`;
}

function renderMenu() {
  const raw = $("#q").value.trim();
  const q = fold(raw);
  let html = "";
  for (const c of MENU) {
    const catHit = q && (fold(c.sr).includes(q) || fold(c.en).includes(q));
    let curSub = null;
    const parts = [];
    let count = 0;
    for (const i of c.items) {
      if (i.sub) curSub = i.sub;
      const hay = fold([i.sr, i.en, tr(i.d), i.d && i.d.en, sizeText(i), curSub && curSub.sr].filter(Boolean).join(" "));
      if (q && !catHit && !hay.includes(q)) continue;
      if (curSub && curSub !== parts.lastSub) { parts.push(`</div><p class="sub">${esc(tr(curSub))}</p><div class="list">`); parts.lastSub = curSub; }
      parts.push(rowHTML(i));
      count++;
    }
    if (!count) continue;
    html += `<section class="cat" id="${c.id}">
      <div class="cat-head"><h3>${esc(tr(c))}</h3><span class="n">${t("items")(count)}</span></div>
      <div class="list">${parts.join("")}</div></section>`;
  }
  $("#menu").innerHTML = html.replace(/<div class="list"><\/div>/g, "") || `<p class="empty">${esc(t("none")(raw))}</p>`;
  document.querySelectorAll(".tab").forEach(b => { b.hidden = !!q && !document.getElementById(b.dataset.go); });
  observe();
}

let io;
function observe() {
  if (io) io.disconnect();
  if (!("IntersectionObserver" in window)) return;
  io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    document.querySelectorAll(".tab").forEach(b => {
      const on = b.dataset.go === e.target.id;
      b.classList.toggle("on", on);
      if (on) $("#tabs").scrollTo({ left: b.offsetLeft - 16, behavior: "smooth" });
    });
  }), { rootMargin: "-90px 0px -65% 0px" });
  document.querySelectorAll(".cat").forEach(s => io.observe(s));
}

function openItem(i) {
  const desc = tr(i.d);
  const variants = i.v
    ? `<p class="sub" style="margin:6px 0 0">${t("sizes")}</p><div class="variants">${i.v.map(x => `<div><span>${esc(tr(x[0]) || nameOf(i))}</span><b>${money(x[1])} RSD</b></div>`).join("")}</div>`
    : `<div class="variants"><div><span>${esc(sizeText(i) || nameOf(i))}</span><b>${money(i.p)} RSD</b></div></div>`;
  $("#sheetBody").innerHTML = `${ph(i.img, i.icon || i.cat.icon, i.promo)}
    <div class="in">${badge(i)}<h3 id="sheetTitle">${esc(nameOf(i))}</h3>
    ${i.cat ? `<p>${esc(tr(i.cat))}</p>` : ""}
    ${desc ? `<p>${esc(desc)}</p>` : ""}${variants}</div>`;
  const d = $("#sheet");
  if (d.showModal) d.showModal(); else d.setAttribute("open", "");
}

document.addEventListener("click", e => {
  const go = e.target.closest("[data-go]");
  if (go) { document.getElementById(go.dataset.go)?.scrollIntoView({ behavior: "smooth" }); return; }
  const it = e.target.closest("[data-key]");
  if (it && byKey[it.dataset.key]) openItem(byKey[it.dataset.key]);
});
$("#sheetClose").onclick = () => $("#sheet").close();
$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") e.target.close(); });

$("#langBtn").onclick = () => {
  lang = lang === "sr" ? "en" : "sr";
  try { localStorage.setItem("bc-lang", lang); } catch (e) {}
  renderStatic(); renderMenu();
};
$("#themeBtn").onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
};
$("#searchBtn").onclick = () => {
  $("#searchbar").hidden = false;
  $("#tabsWrap").scrollIntoView({ behavior: "smooth" });
  setTimeout(() => $("#q").focus(), 300);
};
$("#searchClose").onclick = () => { $("#q").value = ""; $("#searchbar").hidden = true; renderMenu(); };
$("#q").addEventListener("input", renderMenu);

// Naslovna fotografija, ako postoji
(() => {
  const img = new Image();
  img.onload = () => { img.alt = ""; $("#cover").prepend(img); };
  img.src = SETTINGS.imgDir + "cover" + SETTINGS.imgExt;
})();
if (SETTINGS.instagram) { $("#instaLink").href = SETTINGS.instagram; $("#instaLink").hidden = false; }
$("#year").textContent = new Date().getFullYear();

renderStatic();
renderMenu();
</script>
